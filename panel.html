<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdPilot</title>
<style>
:root{--bg:#f4f6f8;--cd:#fff;--tx:#18212b;--mu:#667585;--bd:#e1e6eb;--pr:#2457e6;--ok:#12805c;--wa:#b86e00;--er:#c62828;--okb:#e3f5ee;--wab:#fff2dc;--erb:#fde8e8}
@media(prefers-color-scheme:dark){:root{--bg:#0f141a;--cd:#18202a;--tx:#e8edf2;--mu:#93a1b0;--bd:#2a3541;--pr:#6b93ff;--ok:#4cd6a0;--wa:#ffb84d;--er:#ff7b7b;--okb:#12302a;--wab:#3a2c10;--erb:#3a1818}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:18px}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:var(--pr);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.k{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}.k small{color:var(--mu);display:block}.k b{font-size:22px}
.btn{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mut{color:var(--mu)}.sm{font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bd);color:var(--mu)}.tag.ok{background:var(--okb);color:var(--ok)}.tag.wa{background:var(--wab);color:var(--wa)}.tag.er{background:var(--erb);color:var(--er)}
input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}
.sug{border-left:4px solid var(--pr)}.sug.pausar_adset,.sug.pausar_ad{border-left-color:var(--er)}.sug.orcamento{border-left-color:var(--ok)}.sug.aviso{border-left-color:var(--wa)}
.login{max-width:340px;margin:12vh auto;padding:0 16px}.scroll{overflow-x:auto}
</style></head><body><div id="app"></div>
<script>
var TOK=null;try{TOK=sessionStorage.getItem('ap_t')}catch(e){}
var IMG=[],TS=[],IMGU={},NT=null,TV=[],tab='resumo',DIAS=7,ST=null,RS=null,CJ=[],SG=[],AC=[],BUSY=false,ERR='';
function $(i){return document.getElementById(i)}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function R(n){return n==null?'—':'R$ '+Number(n).toFixed(2).replace('.',',')}
function N(n){return Math.round(n||0).toLocaleString('pt-BR')}
async function api(p,o){o=o||{};var h={'Content-Type':'application/json'};if(TOK)h.Authorization='Bearer '+TOK;var r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:o.body});var j={};try{j=await r.json()}catch(e){}if(r.status===401&&p!=='/login'){TOK=null;try{sessionStorage.removeItem('ap_t')}catch(e){}draw();throw new Error('Faça login de novo.')}if(!r.ok)throw new Error(j.error||'Erro '+r.status);return j}
function draw(){var a=$('app');if(!TOK){a.innerHTML='<div class="login card"><h2 style="margin-top:0">✈️ AdPilot</h2><label>Senha<input id="sn" type="password" onkeydown="if(event.key===\'Enter\')entrar()"></label><button class="btn p" onclick="entrar()" style="width:100%">Entrar</button><p class="mut sm" id="le"></p></div>';return}
  var n=SG.length,tabs=[['resumo','📊 Resumo'],['sug','💡 Sugestões'+(n?' ('+n+')':'')],['conj','📋 Conjuntos'],['teste','🧪 Testes'],['cria','🖼 Criativos'],['hist','🕘 Histórico'],['cfg','⚙️ Metas']];
  a.innerHTML='<header><b>✈️ AdPilot</b><nav>'+tabs.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="if(NT)lerTeste();tab=\''+t[0]+'\';draw()">'+t[1]+'</button>'}).join('')+'</nav><span style="flex:1"></span><button class="btn p" onclick="sync()"'+(BUSY?' disabled':'')+'>'+(BUSY?'Atualizando…':'🔄 Atualizar dados')+'</button><button class="btn" onclick="sair()">Sair</button></header><main>'+aviso()+({resumo:vResumo,sug:vSug,conj:vConj,teste:vTeste,cria:vCria,hist:vHist,cfg:vCfg}[tab])()+'</main>'}
function aviso(){var h='';if(ERR)h+='<div class="card" style="border-color:var(--er)"><b>⚠️ '+E(ERR)+'</b></div>';
  if(ST&&!ST.meta)h+='<div class="card" style="border-color:var(--wa)"><b>Meta ainda não conectada.</b><div class="mut sm">No Railway, crie as variáveis <code>META_ACCESS_TOKEN</code> e <code>META_AD_ACCOUNT_ID</code> (veja o README) e reinicie.</div></div>';
  else if(ST&&ST.contaErro)h+='<div class="card" style="border-color:var(--er)"><b>A Meta recusou a conexão:</b> '+E(ST.contaErro)+'</div>';
  else if(ST&&ST.ultimo_sync&&!ST.ultimo_sync.ok)h+='<div class="card" style="border-color:var(--er)"><b>Última atualização falhou:</b> '+E(ST.ultimo_sync.msg)+'</div>';return h}
async function entrar(){try{var r=await api('/login',{method:'POST',body:JSON.stringify({senha:$('sn').value})});TOK=r.token;try{sessionStorage.setItem('ap_t',TOK)}catch(e){}await carregar()}catch(e){$('le').textContent=e.message}}
function sair(){TOK=null;try{sessionStorage.removeItem('ap_t')}catch(e){}draw()}
async function carregar(){ERR='';try{ST=await api('/status');RS=await api('/resumo?dias='+DIAS);CJ=await api('/conjuntos?dias='+DIAS);SG=await api('/sugestoes');AC=await api('/acoes');IMG=await api('/imagens');TS=await api('/testes');IMG.forEach(carregaImg)}catch(e){ERR=e.message}draw()}
async function sync(){BUSY=true;ERR='';draw();try{var r=await api('/sync',{method:'POST'});toast(r.novas+' sugestão(ões) nova(s)')}catch(e){ERR=e.message}BUSY=false;await carregar()}
function toast(m){var d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18212b;color:#fff;padding:10px 18px;border-radius:10px;z-index:99';document.body.appendChild(d);setTimeout(function(){d.remove()},2500)}
function per(){return '<div class="row" style="margin-bottom:12px">'+[1,3,7,14,30].map(function(d){return '<button class="btn'+(DIAS===d?' p':'')+'" onclick="DIAS='+d+';carregar()">'+(d===1?'Hoje':d+' dias')+'</button>'}).join('')+'</div>'}
function vResumo(){if(!RS)return '<p class="mut">Carregando…</p>';var r=RS,kp=function(t,v,s,c){return '<div class="k"><small>'+t+'</small><b style="color:'+(c||'inherit')+'">'+v+'</b>'+(s?'<small>'+s+'</small>':'')+'</div>'};
  var cm=r.cpa_msg==null?null:(r.cpa_msg<=r.meta_cpa_msg?'var(--ok)':'var(--er)'),cs=r.cpa_site==null?null:(r.cpa_site<=r.meta_cpa_site?'var(--ok)':'var(--er)');
  var max=Math.max.apply(null,r.por_dia.map(function(d){return d.gasto}).concat([1]));
  var graf=r.por_dia.length?'<div class="row" style="align-items:flex-end;height:120px;gap:6px;flex-wrap:nowrap">'+r.por_dia.map(function(d){return '<div style="flex:1;text-align:center" title="'+d.dia+': '+R(d.gasto)+', '+N(d.res)+' resultados"><div style="background:var(--pr);border-radius:4px 4px 0 0;height:'+Math.max(2,d.gasto/max*100)+'px"></div><div class="mut" style="font-size:11px">'+d.dia.slice(8)+'/'+d.dia.slice(5,7)+'</div></div>'}).join('')+'</div>':'<p class="mut">Sem dados ainda. Clique em <b>Atualizar dados</b>.</p>';
  return per()+'<div class="grid">'+kp('Gasto',R(r.gasto))+kp('Conversas iniciadas',N(r.msgs),r.cpa_msg!=null?R(r.cpa_msg)+' cada · meta '+R(r.meta_cpa_msg):'',cm)+kp('Resultados no site',N(r.vendas),r.cpa_site!=null?R(r.cpa_site)+' cada · meta '+R(r.meta_cpa_site):'',cs)+kp('Retorno (site)',r.roas?r.roas.toFixed(2).replace('.',',')+'x':'—',r.valor?R(r.valor)+' vendidos':'')+kp('Cliques',N(r.cliques),r.imp?(r.cliques/r.imp*100).toFixed(2).replace('.',',')+'% CTR':'')+kp('Economia possível',R(r.economia_possivel),'por dia, se aprovar as sugestões','var(--ok)')+'</div><div class="card"><b>Gasto por dia</b>'+graf+'</div>'
   +(SG.length?'<div class="card"><b>'+SG.length+' sugestão(ões) esperando você</b> <button class="btn p" style="margin-left:8px" onclick="tab=\'sug\';draw()">Ver</button></div>':'')}
function vSug(){if(!SG.length)return '<div class="card mut" style="text-align:center">Nenhuma sugestão agora. Tudo dentro das metas, ou ainda sem dados suficientes.</div>';
  return SG.map(function(s){var ic={pausar_adset:'⏸',pausar_ad:'⏸',orcamento:s.titulo.indexOf('Aumentar')>=0?'📈':'📉',aviso:'⚠️'}[s.tipo];var lb=s.tipo==='aviso'?'Entendi':'Aprovar e aplicar';
    return '<div class="card sug '+s.tipo+'"><div class="row" style="justify-content:space-between"><b>'+ic+' '+E(s.titulo)+'</b>'+(s.economia>0?'<span class="tag ok">economiza '+R(s.economia)+'/dia</span>':'')+'</div><p style="margin:6px 0 10px" class="sm">'+E(s.motivo)+'</p><div class="row"><button class="btn ok" onclick="decidir('+s.id+',\'aprovar\')">'+lb+'</button><button class="btn" onclick="decidir('+s.id+',\'rejeitar\')">Ignorar</button></div></div>'}).join('')}
async function decidir(id,a){ERR='';try{await api('/sugestoes/'+id+'/'+a,{method:'POST'});toast(a==='aprovar'?'Feito ✓':'Ignorada')}catch(e){ERR=e.message}await carregar()}
function vConj(){if(!CJ.length)return per()+'<div class="card mut">Nenhum conjunto ainda. Clique em <b>Atualizar dados</b>.</div>';
  var rows=CJ.slice().sort(function(a,b){return b.j.gasto-a.j.gasto}).map(function(a){var cpa=a.j.res?a.j.gasto/a.j.res:null,m=ST?Number(a.tipo==='msg'?ST.config.meta_cpa_msg:ST.config.meta_cpa_site):0;var c=cpa==null?'':(cpa<=m?'var(--ok)':cpa>1.6*m?'var(--er)':'var(--wa)');
    return '<tr><td><b>'+E(a.nome)+'</b><div class="mut sm">'+E(a.campanha)+' · <a href="#" onclick="trocaTipo(\''+a.id+'\',\''+(a.tipo==='msg'?'site':'msg')+'\');return false">'+(a.tipo==='msg'?'💬 mensagens':'🛒 site')+'</a></div></td><td><span class="tag '+(a.status==='ACTIVE'?'ok':'')+'">'+(a.status==='ACTIVE'?'ativo':'pausado')+'</span></td><td>'+R(a.orcamento)+'</td><td>'+R(a.j.gasto)+'</td><td>'+N(a.j.res)+'</td><td style="color:'+c+';font-weight:700">'+R(cpa)+'</td></tr>'}).join('');
  return per()+'<div class="card scroll"><table><tr><th>Conjunto</th><th>Situação</th><th>Verba/dia</th><th>Gasto</th><th>Resultados</th><th>Custo cada</th></tr>'+rows+'</table></div><p class="mut sm">Clique em "mensagens/site" para trocar como o conjunto é medido.</p>'}
async function trocaTipo(id,t){try{await api('/conjuntos/'+id+'/tipo',{method:'PUT',body:JSON.stringify({tipo:t})});await carregar()}catch(e){ERR=e.message;draw()}}
function vHist(){if(!AC.length)return '<div class="card mut">Nada foi alterado ainda.</div>';
  return '<div class="card scroll"><table><tr><th>Quando</th><th>Ação</th><th>Resultado</th><th></th></tr>'+AC.map(function(a){var d=JSON.parse(a.depois||'{}'),t={pausar_adset:'Pausou conjunto',pausar_ad:'Pausou anúncio',orcamento:'Mudou verba',aviso:'Aviso visto'}[a.tipo]||a.tipo;
    var det=a.tipo==='orcamento'&&d.orcamento_cent?' → '+R(d.orcamento_cent/100):'';
    return '<tr><td>'+E(a.criado_em)+'</td><td style="text-align:left"><b>'+t+'</b>'+det+'<div class="mut sm">'+E(a.alvo_nome)+'</div></td><td>'+(a.ok?(a.desfeita?'<span class="tag">desfeita</span>':'<span class="tag ok">aplicada</span>'):'<span class="tag er" title="'+E(a.erro)+'">falhou</span>')+'</td><td>'+(a.ok&&!a.desfeita&&a.tipo!=='aviso'?'<button class="btn" onclick="desfaz('+a.id+')">Desfazer</button>':'')+'</td></tr>'}).join('')+'</table></div>'}
async function desfaz(id){if(!confirm('Desfazer esta ação na Meta?'))return;try{await api('/acoes/'+id+'/desfazer',{method:'POST'});toast('Desfeito ✓')}catch(e){ERR=e.message}await carregar()}
/* ---------- criativos ---------- */
function carregaImg(i){if(IMGU[i.id])return;IMGU[i.id]='...';fetch('/api/imagens/'+i.id+'/arquivo',{headers:{Authorization:'Bearer '+TOK}}).then(function(r){return r.blob()}).then(function(b){IMGU[i.id]=URL.createObjectURL(b);if(NT&&tab==='teste')lerTeste();if(tab==='cria'||tab==='teste')draw()}).catch(function(){})}
function thumb(id,w){var u=IMGU[id];return u&&u!=='...'?'<img src="'+u+'" style="width:'+w+'px;height:'+w+'px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)">':'<div style="width:'+w+'px;height:'+w+'px;border-radius:8px;background:var(--bd)"></div>'}
function vCria(){return '<div class="card"><b>Biblioteca de imagens</b><p class="mut sm">Suba as fotos que vão virar anúncio (PNG ou JPG, até 8 MB; ideal quadrada ou vertical). Use fotos reais do produto: costumam converter melhor que arte genérica.</p><input type="file" id="fi" accept="image/png,image/jpeg" multiple onchange="subir(this.files)"></div>'
  +'<div class="card row" style="gap:12px">'+(IMG.length?IMG.map(function(i){return '<div style="text-align:center">'+thumb(i.id,110)+'<div class="sm mut" style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+E(i.nome)+'</div><a href="#" class="sm" onclick="apagaImg('+i.id+');return false">apagar</a></div>'}).join(''):'<span class="mut">Nenhuma imagem ainda.</span>')+'</div>'}
function subir(fs){Array.prototype.forEach.call(fs,function(f){if(f.size>8*1024*1024){ERR=f.name+' tem mais de 8 MB.';draw();return}var r=new FileReader();r.onload=async function(){try{await api('/imagens',{method:'POST',body:JSON.stringify({nome:f.name,dados:r.result})});await carregar();toast('Imagem enviada ✓')}catch(e){ERR=e.message;draw()}};r.readAsDataURL(f)})}
async function apagaImg(id){if(!confirm('Apagar esta imagem?'))return;try{await api('/imagens/'+id,{method:'DELETE'});delete IMGU[id];await carregar()}catch(e){ERR=e.message;draw()}}
/* ---------- testes A/B ---------- */
var ST_T={rascunho:['rascunho',''],criado:['criado na Meta (pausado)','wa'],rodando:['rodando','ok'],concluido:['concluído','ok'],erro:['erro','er'],descartado:['descartado','']};
function vTeste(){var novo=NT?formTeste():'<div class="card row"><button class="btn p" onclick="novoTeste()">＋ Novo teste</button><span class="mut sm">Compare 2 a 6 variações de anúncio com a mesma verba e público. O melhor ganha, o resto é pausado (com sua aprovação).</span></div>';
  return novo+(TS.length?TS.map(cardTeste).join(''):(NT?'':'<div class="card mut" style="text-align:center">Nenhum teste ainda.</div>'))}
function cardTeste(t){var s=ST_T[t.status]||[t.status,''],r=t.resultado||{},linhas=r.linhas||[],bt='';
  if(t.status==='rascunho'||t.status==='erro')bt+='<button class="btn p" onclick="tAcao('+t.id+',\'criar\')">Criar na Meta (pausado)</button>';
  if(t.status==='criado')bt+='<button class="btn ok" onclick="publicaTeste('+t.id+','+t.orcamento_dia+','+t.dias+')">▶ Publicar e começar a gastar</button>';
  if(t.status!=='rodando'&&t.status!=='descartado'&&t.status!=='concluido')bt+='<button class="btn" onclick="descartaTeste('+t.id+')">Descartar</button>';
  var tab=t.variacoes.map(function(v){var l=linhas.find(function(x){return x.id===v.id})||{};var venc=r.vencedor_id===v.id&&r.estado==='vencedor';
    return '<tr><td style="text-align:left"><div class="row" style="flex-wrap:nowrap">'+thumb(v.imagem_id,44)+'<div><b>'+v.rotulo+(venc?' 🏆':'')+'</b> <span class="mut sm">'+E(v.angulo)+'</span><div class="sm">'+E(v.titulo)+'</div></div></div></td><td>'+(l.gasto!=null?R(l.gasto):'—')+'</td><td>'+(l.res!=null?N(l.res):'—')+'</td><td>'+(l.cpa?R(l.cpa):'—')+'</td></tr>'}).join('');
  return '<div class="card"><div class="row" style="justify-content:space-between"><b>🧪 '+E(t.nome)+'</b><span class="tag '+s[1]+'">'+s[0]+'</span></div><div class="mut sm">'+(t.objetivo==='msg'?'💬 mensagens':'🛒 site')+' · '+R(t.orcamento_dia)+'/dia no total · '+t.dias+' dias</div>'
   +(t.erro?'<p class="sm" style="color:var(--er)">'+E(t.erro)+'</p>':'')+(r.resumo?'<p class="sm"><b>'+E(r.resumo)+'</b></p>':'')+'<div class="scroll"><table><tr><th>Variação</th><th>Gasto</th><th>Resultados</th><th>Custo cada</th></tr>'+tab+'</table></div><div class="row" style="margin-top:10px">'+bt+'</div></div>'}
function novoTeste(){NT={nome:'',objetivo:'msg',verba:30,dias:5,link:'',produto:'',publico:'',beneficio:'',oferta:'',n:3,raio:15,imin:18,imax:65,lat:null,lng:null};TV=[];draw()}
function lerTeste(){['nome','link','produto','publico','beneficio','oferta'].forEach(function(k){var e=$('t_'+k);if(e)NT[k]=e.value});['objetivo','verba','dias','n','raio','imin','imax'].forEach(function(k){var e=$('t_'+k);if(e)NT[k]=e.value});TV.forEach(function(v,i){var a=$('v_t'+i),b=$('v_x'+i),c=$('v_i'+i);if(a)v.titulo=a.value;if(b)v.texto=b.value;if(c)v.imagem_id=c.value?Number(c.value):null})}
function formTeste(){var f=function(id,l,v,x){return '<label>'+l+'<input id="t_'+id+'" value="'+E(v)+'" '+(x||'')+'></label>'};
  var vars=TV.length?'<b>Variações</b>'+TV.map(function(v,i){return '<div class="card" style="margin:8px 0"><div class="row"><b>'+String.fromCharCode(65+i)+'</b><span class="tag">'+E(v.angulo_nome||v.angulo||'')+'</span></div><label>Título (até 40)<input id="v_t'+i+'" maxlength="40" value="'+E(v.titulo)+'"></label><label>Texto (até 180)<input id="v_x'+i+'" maxlength="180" value="'+E(v.texto)+'"></label><label>Imagem<select id="v_i'+i+'" style="width:100%;padding:9px;border-radius:8px"><option value="">— escolha —</option>'+IMG.map(function(m){return '<option value="'+m.id+'"'+(v.imagem_id===m.id?' selected':'')+'>'+E(m.nome)+'</option>'}).join('')+'</select></label></div>'}).join('')+'<div class="row"><button class="btn p" onclick="salvaTeste()">Salvar teste</button><button class="btn" onclick="NT=null;draw()">Cancelar</button></div>':'';
  return '<div class="card"><b>Novo teste</b>'+f('nome','Nome do teste',NT.nome,'placeholder="Ex.: Placas para barbearias"')
   +'<div class="row"><label style="flex:1">Objetivo<select id="t_objetivo" onchange="lerTeste();draw()" style="width:100%;padding:9px;border-radius:8px"><option value="msg"'+(NT.objetivo==='msg'?' selected':'')+'>💬 Conversas no Instagram Direct</option><option value="site"'+(NT.objetivo==='site'?' selected':'')+'>🛒 Visitas ao site</option></select></label><div style="flex:1">'+f('verba','Verba por dia, total (R$)',NT.verba,'inputmode="decimal"')+'</div><div style="flex:1">'+f('dias','Duração (dias)',NT.dias,'inputmode="numeric"')+'</div></div>'
   +(NT.objetivo==='site'?f('link','Link do site (https://...)',NT.link):'')
   +'<div class="row"><div style="flex:1">'+f('raio','Raio em volta de você (km)',NT.raio,'inputmode="numeric"')+'</div><div style="flex:1">'+f('imin','Idade mínima',NT.imin)+'</div><div style="flex:1">'+f('imax','Idade máxima',NT.imax)+'</div></div>'
   +'<button class="btn" onclick="locTeste()">📍 '+(NT.lat!=null?'Região definida pela sua localização ✓':'Usar minha localização como centro (senão, Brasil todo)')+'</button>'
   +'<hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><b>Sobre o que é o anúncio</b>'+f('produto','Produto ou serviço',NT.produto,'placeholder="Ex.: placa NFC de avaliação do Google"')+f('publico','Para quem',NT.publico,'placeholder="Ex.: barbearias e salões"')+f('beneficio','Benefício principal',NT.beneficio,'placeholder="Ex.: ter mais avaliações 5 estrelas"')+f('oferta','Oferta (opcional)',NT.oferta,'placeholder="Ex.: 10% de desconto no primeiro pedido"')
   +'<div class="row" style="align-items:flex-end"><label style="margin:0">Quantas variações<select id="t_n" style="padding:9px;border-radius:8px">'+[2,3,4,5,6].map(function(n){return '<option'+(Number(NT.n)===n?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label><button class="btn p" onclick="geraTextos()">✨ Gerar textos</button></div></div>'+(vars?'<div class="card">'+vars+'</div>':'')}
function locTeste(){lerTeste();if(!navigator.geolocation){alert('Este aparelho não permite localização.');return}navigator.geolocation.getCurrentPosition(function(p){NT.lat=p.coords.latitude;NT.lng=p.coords.longitude;draw()},function(){alert('Não consegui pegar sua localização.')},{timeout:10000})}
async function geraTextos(){lerTeste();try{var r=await api('/copy',{method:'POST',body:JSON.stringify({produto:NT.produto,publico:NT.publico,beneficio:NT.beneficio,oferta:NT.oferta,objetivo:NT.objetivo,n:Number(NT.n)})});TV=r.map(function(x,i){x.imagem_id=IMG.length?IMG[i%IMG.length].id:null;return x});if(!IMG.length)toast('Suba imagens na aba Criativos para escolher uma por variação');draw()}catch(e){ERR=e.message;draw()}}
async function salvaTeste(){lerTeste();var b={nome:NT.nome,objetivo:NT.objetivo,orcamento_dia:NT.verba,dias:NT.dias,link:NT.link,lat:NT.lat,lng:NT.lng,raio_km:NT.raio,idade_min:NT.imin,idade_max:NT.imax,variacoes:TV.map(function(v){return {titulo:v.titulo,texto:v.texto,angulo:v.angulo,imagem_id:v.imagem_id}})};
  try{await api('/testes',{method:'POST',body:JSON.stringify(b)});NT=null;TV=[];ERR='';await carregar();toast('Teste salvo. Agora clique em Criar na Meta.')}catch(e){ERR=e.message;draw()}}
async function tAcao(id,a){ERR='';BUSY=true;draw();try{await api('/testes/'+id+'/'+a,{method:'POST'});toast('Criado na Meta, pausado ✓')}catch(e){ERR=e.message}BUSY=false;await carregar()}
async function publicaTeste(id,orc,dias){if(!confirm('Isso LIGA os anúncios e começa a gastar até '+R(orc)+' por dia durante '+dias+' dias (cerca de '+R(orc*dias)+' no total). Confirmar?'))return;try{await api('/testes/'+id+'/publicar',{method:'POST'});toast('Teste no ar ✓')}catch(e){ERR=e.message}await carregar()}
async function descartaTeste(id){if(!confirm('Descartar este teste (e apagar da Meta o que já foi criado)?'))return;try{await api('/testes/'+id+'/descartar',{method:'POST'})}catch(e){ERR=e.message}await carregar()}
var CAMPOS=[['meta_cpa_msg','Custo máximo por conversa (R$)'],['meta_cpa_site','Custo máximo por resultado no site (R$)'],['roas_min','Retorno mínimo no site (vezes)'],['janela_dias','Dias analisados para decidir'],['espera_horas','Horas sem mexer em conjunto novo/alterado'],['passo_escala_pct','Aumento máximo de verba por vez (%)'],['orcamento_max_adset','Teto de verba diária por conjunto (R$, 0 = sem teto)'],['orcamento_max_total','Teto da soma das verbas diárias (R$, 0 = sem teto)'],['freq_max','Frequência que indica público saturado'],['teste_max_dia','Teto de verba diária de um teste (R$)'],['teste_min_variacao','Verba diária mínima por variação (R$)'],['teste_dias','Duração padrão do teste (dias)']];
function vCfg(){if(!ST)return '';var c=ST.config;return '<div class="card"><b>Suas metas e limites</b><p class="mut sm">O robô só sugere; nada muda na Meta sem você aprovar. Estas regras definem quando ele sugere.</p>'+CAMPOS.map(function(f){return '<label>'+f[1]+'<input id="c_'+f[0]+'" value="'+E(c[f[0]])+'" inputmode="decimal"></label>'}).join('')+'<button class="btn p" onclick="salvaCfg()">Salvar</button></div>'
   +'<div class="card sm"><b>Conta conectada</b><div>'+(ST.conta?E(ST.conta.name)+' · '+E(ST.conta.currency):'—')+'</div>'+(ST.ultimo_sync?'<div class="mut">Última atualização: '+E(ST.ultimo_sync.criado_em)+' UTC — '+E(ST.ultimo_sync.msg)+'</div>':'')+'</div>'}
async function salvaCfg(){var b={};CAMPOS.forEach(function(f){b[f[0]]=$('c_'+f[0]).value});try{await api('/config',{method:'PUT',body:JSON.stringify(b)});toast('Salvo ✓');await carregar()}catch(e){ERR=e.message;draw()}}
if(TOK)carregar();else draw();
</script></body></html>
